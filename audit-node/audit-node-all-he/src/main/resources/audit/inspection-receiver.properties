# \u5F53\u524D\u7684\u81EA\u52A8\u5BA1\u8BA1\u63A5\u6536\u5668\u7C7B\u578B\u3002
# \u76EE\u524D\u8BE5\u9879\u76EE\u652F\u6301\u7684\u81EA\u52A8\u5BA1\u8BA1\u63A5\u6536\u5668\u7C7B\u578B\u6709:
#   do_nothing: \u4EC0\u4E48\u4E5F\u4E0D\u505A\u7684\u63A5\u6536\u5668\uFF0C\u7528\u4E8E\u6D4B\u8BD5\u3002
#   injvm: \u865A\u62DF\u673A\u5185\u90E8\u63A5\u6536\u5668\uFF0C\u7528\u4E8E\u5355\u8282\u70B9\u670D\u52A1\u3002
#   kafka: \u57FA\u4E8E Kafka \u5B9E\u73B0\u7684\u63A5\u6536\u5668\uFF0C\u7528\u4E8E\u591A\u4E2A\u8282\u70B9\u7684\u8D1F\u8F7D\u5747\u8861\u3002
#   dubbo: \u57FA\u4E8E Dubbo \u5B9E\u73B0\u7684\u63A5\u6536\u5668\uFF0C\u7528\u4E8E\u591A\u4E2A\u8282\u70B9\u7684\u8D1F\u8F7D\u5747\u8861\u3002
com.dwarfeng.audit.inspection_receiver.type=do_nothing
#
###################################################
#                      kafka                      #
###################################################
com.dwarfeng.audit.inspection_receiver.kafka.bootstrap_servers=your-ip1:9092,your-ip2:9092,your-ip3:9092
com.dwarfeng.audit.inspection_receiver.kafka.session_timeout_ms=10000
