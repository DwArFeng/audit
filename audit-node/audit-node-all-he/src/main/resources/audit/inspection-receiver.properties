com.dwarfeng.audit.inspection_receiver.kafka.poll_timeout=3000
com.dwarfeng.audit.inspection_receiver.kafka.listener_id=audit.inspection_receiver
com.dwarfeng.audit.inspection_receiver.kafka.listener_topic=audit-inspection-dispatch
com.dwarfeng.audit.inspection_receiver.kafka.max_poll_records=100
com.dwarfeng.audit.inspection_receiver.kafka.max_poll_interval_ms=300000
